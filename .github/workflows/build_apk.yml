name: Build Android APK with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Host Python: Python 3.10 is the most stable version for Buildozer & Cython 0.29.x
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 2. Set up Java 17 and configure JAVA_HOME properly for Gradle/Android SDK
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # 3. Cache Buildozer and dependencies (keyed by spec, python, and java versions)
      - name: Cache Buildozer Global and Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v4-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v4-
            ${{ runner.os }}-buildozer-

      # 4. Install System Dependencies
      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache \
            libsqlite3-dev \
            sqlite3 \
            liblzma-dev \
            libbz2-dev

      # 5. Install Buildozer, Cython, and packaging tools
      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install "Cython==0.29.33" "buildozer>=1.5.0" virtualenv packaging wheel

      # 6. Pre-cache liblzma source and patch recipe to bypass tukaani.org network timeout
      - name: Pre-cache liblzma
        run: |
          mkdir -p .buildozer/android/platform/build-arm64-v8a/packages/liblzma
          TARGET=".buildozer/android/platform/build-arm64-v8a/packages/liblzma/xz-5.2.4.tar.gz"
          curl -fL -A "Mozilla/5.0" --retry 3 --connect-timeout 15 \
            "https://downloads.sourceforge.net/project/lzmautils/xz-5.2.4.tar.gz" -o "$TARGET" || \
          curl -fL -A "Mozilla/5.0" --retry 3 --connect-timeout 15 \
            "https://fossies.org/linux/misc/xz-5.2.4.tar.gz" -o "$TARGET"
          ls -lh "$TARGET"
          if [ ! -d ".buildozer/android/platform/python-for-android" ]; then
            git clone --depth 1 https://github.com/kivy/python-for-android.git .buildozer/android/platform/python-for-android
          fi
          sed -i 's|https://tukaani.org/xz/xz-{version}.tar.gz|https://downloads.sourceforge.net/project/lzmautils/xz-{version}.tar.gz|g' \
            .buildozer/android/platform/python-for-android/pythonforandroid/recipes/liblzma/__init__.py || true

      # 7. Build APK with Buildozer (pipe 'yes' to auto-accept Android SDK licenses)
      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      # 8. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurumTrustBank-APK
          path: bin/*.apk
          retention-days: 14
