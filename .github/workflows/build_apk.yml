name: Build Android APK with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Host Python: Python 3.10 is the recommended host environment for Buildozer & Cython 0.29.x
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 2. Set up Java 17 and configure JAVA_HOME properly for Gradle and Android SDK
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # 3. Cache Buildozer dependencies (scoped by toolchain to avoid cache poisoning)
      - name: Cache Buildozer Global and Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-py3.10-jdk17-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-py3.10-jdk17-
            ${{ runner.os }}-buildozer-

      # 4. Install System Dependencies (removed libtinfo5 & libncurses5-dev; added libncurses-dev & sqlite3)
      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache \
            libsqlite3-dev \
            sqlite3

      # 5. Install Buildozer, Cython, and packaging tools
      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install "Cython==0.29.33" "buildozer>=1.5.0" virtualenv packaging wheel

      # 6. Build APK with Buildozer (pipe 'yes' to auto-accept Android SDK licenses)
      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      # 7. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurumTrustBank-APK
          path: bin/*.apk
          retention-days: 14
