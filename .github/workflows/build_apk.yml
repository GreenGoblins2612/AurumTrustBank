name: Build Android APK with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Host Python: Python 3.10 is the most stable version for Buildozer & Cython 0.29.x
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 2. Set up Java 17 and configure JAVA_HOME properly for Gradle/Android SDK
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # 3. Cache Buildozer and dependencies (keyed by spec, python, and java versions)
      - name: Cache Buildozer Global and Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v5-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v5-
            ${{ runner.os }}-buildozer-

      # 4. Install System Dependencies
      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache \
            libsqlite3-dev \
            sqlite3 \
            liblzma-dev \
            libbz2-dev

      # 5. Install Buildozer, Cython, and packaging tools
      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install "Cython==0.29.33" "buildozer>=1.5.0" virtualenv packaging wheel

      # 6. Pre-cache liblzma source to bypass tukaani.org network timeout
      - name: Pre-cache liblzma
        run: |
          python - << 'EOF'
          import urllib.request, os, sys

          target = ".buildozer/android/platform/build-arm64-v8a/packages/liblzma/xz-5.2.4.tar.gz"
          os.makedirs(os.path.dirname(target), exist_ok=True)

          urls = [
              "https://web.archive.org/web/20200320000000id_/https://tukaani.org/xz/xz-5.2.4.tar.gz",
              "https://git.manpage.org/tarballs-software.git/plain/xz-5.2.4.tar.gz",
              "https://tukaani.org/xz/xz-5.2.4.tar.gz"
          ]

          downloaded = False
          headers = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"}
          for url in urls:
              try:
                  print(f"Attempting download from {url}...")
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as resp, open(target, "wb") as f:
                      f.write(resp.read())
                  size = os.path.getsize(target)
                  if size > 1000000:
                      print(f"Successfully downloaded {target} ({size} bytes)")
                      downloaded = True
                      break
                  else:
                      print(f"Downloaded file too small ({size} bytes), trying next...")
              except Exception as e:
                  print(f"Download failed from {url}: {e}")

          if not downloaded:
              print("Warning: Could not pre-download archive, will rely on p4a download")

          p4a_dir = ".buildozer/android/platform/python-for-android"
          if not os.path.exists(p4a_dir):
              os.system(f"git clone --depth 1 https://github.com/kivy/python-for-android.git {p4a_dir}")

          recipe = os.path.join(p4a_dir, "pythonforandroid/recipes/liblzma/__init__.py")
          if os.path.exists(recipe):
              with open(recipe, "r") as f:
                  content = f.read()
              mirror = "https://web.archive.org/web/20200320000000id_/https://tukaani.org/xz/xz-{version}.tar.gz"
              content = content.replace("https://tukaani.org/xz/xz-{version}.tar.gz", mirror)
              with open(recipe, "w") as f:
                  f.write(content)
              print("Patched liblzma recipe with Wayback Machine mirror.")
          EOF

      # 7. Build APK with Buildozer (pipe 'yes' to auto-accept Android SDK licenses)
      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      # 8. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurumTrustBank-APK
          path: bin/*.apk
          retention-days: 14
